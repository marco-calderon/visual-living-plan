[package]
name = "living-plan-desktop"
# The app's version is package.json's: tauri.conf.json reads it from there. This one is unused.
version = "0.0.0"
description = "Living Plan as a desktop app: a window on this machine's plan service"
license = "MIT"
repository = "https://github.com/marco-calderon/visual-living-plan"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "living_plan_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
