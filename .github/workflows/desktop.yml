name: Desktop

# Builds the Living Plan desktop app (src-tauri) on macOS, Linux, and Windows.
# Runs on pull requests that touch the app, by hand, and on a published release, where the
# installers are attached to that release. The builds are unsigned. See ADR 0036.
on:
  pull_request:
    paths:
      - src-tauri/**
      - desktop/**
      - scripts/build-desktop.ts
      - .github/workflows/desktop.yml
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Bun that setup-bun installs is the one shipped, so each job builds for its own machine.
          - name: macOS arm64
            os: macos-latest
          - name: Linux x64
            os: ubuntu-22.04
          - name: Windows x64
            os: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: bun install --frozen-lockfile

      # Stages the bundled service and Bun (bun run desktop:stage), then builds the installers.
      - name: Build the app
        run: bun run desktop:build

      - name: Rust tests
        if: runner.os == 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: actions/upload-artifact@v7
        with:
          name: living-plan-desktop-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Attach the installers to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/{deb/*.deb,rpm/*.rpm,dmg/*.dmg,nsis/*.exe,msi/*.msi})
          gh release upload "${{ github.event.release.tag_name }}" "${files[@]}" --clobber
