name: Publish

# Publish visual-living-plan to npm when a GitHub release is published.
# Uses npm trusted publishing (OIDC), so no NPM_TOKEN is stored in the repo.
# Requires id-token: write, npm >= 11.5.1, and a trusted publisher on npm for
# the visual-living-plan package pointing at this workflow.
# The published version comes from the release tag (tag "v0.1.0" or "0.1.0").
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run typecheck

      - name: Set version from the release tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # prepack compiles dist/cli.js and the workflow client into the tarball.
      - name: Publish to npm
        run: npm publish --access public
